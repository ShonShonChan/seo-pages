name: Telegram Claude Agent
run-name: "Telegram Claude Agent · ${{ github.event.client_payload.request_id || inputs.request_id || github.run_id }}"

# Telegram → Cloudflare Worker → repository_dispatch → このワークフロー
# → Claude Code → 必要に応じて作業ブランチへpush → PR作成 → Telegramへ結果通知
#
# ルール:
#   - mainへ直接pushしない。変更は必ず作業ブランチ + PRを経由する
#   - 実行ごとに新しい作業ブランチを作る
#   - 調査のみの場合はファイル変更・commit・push・PR作成をしない
#   - 変更があるときだけcommit・push・PR作成
#   - 通常の修正依頼は、Claude Codeが検証完了・安全と判断した場合にPRを自動マージできる
#   - ユーザーが「PRまで」「マージしない」「確認後にマージ」等を指定した場合は自動マージしない
#   - 既存PRのClose / Merge / Revertは、ユーザーが明示的に依頼した場合だけActions側で実行する
#   - Revert対象PRが未マージなら、RevertではなくPR Closeとして扱う
#   - mainへのマージ後は、既存のCloudflare Pages連携によるProductionデプロイ対象となる
#   - Telegramには結論・主要結果・次の行動だけを短く返す

on:
  repository_dispatch:
    types: [telegram_claude_agent]

  workflow_dispatch:
    inputs:
      task:
        description: "Claude Codeへの作業指示"
        required: true
        type: string
      chat_id:
        description: "Telegram chat_id（手動テスト時は任意）"
        required: false
        default: "manual"
        type: string
      request_id:
        description: "リクエスト識別子（手動テスト時は任意）"
        required: false
        default: "manual"
        type: string
      photo_file_id:
        description: "Telegram画像のfile_id（手動テスト時は任意）"
        required: false
        default: ""
        type: string
      photo_file_name:
        description: "画像ファイル名のヒント（任意）"
        required: false
        default: ""
        type: string
      document_file_id:
        description: "Telegram一般ファイルのfile_id（ZIP / HTML / TXT / PDF等）"
        required: false
        default: ""
        type: string
      document_file_name:
        description: "一般ファイル名のヒント（任意）"
        required: false
        default: ""
        type: string
      document_mime_type:
        description: "一般ファイルのMIME type（任意）"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: telegram-claude-agent-${{ github.event.client_payload.request_id || inputs.request_id || github.run_id }}
  cancel-in-progress: false

jobs:
  agent:
    name: Run Claude Code and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TASK: ${{ github.event.client_payload.task || inputs.task }}
      CHAT_ID: ${{ github.event.client_payload.chat_id || inputs.chat_id || 'manual' }}
      REQUEST_ID: ${{ github.event.client_payload.request_id || inputs.request_id || 'manual' }}
      PHOTO_FILE_ID: ${{ github.event.client_payload.photo_file_id || inputs.photo_file_id || '' }}
      PHOTO_FILE_NAME: ${{ github.event.client_payload.photo_file_name || inputs.photo_file_name || '' }}
      DOCUMENT_FILE_ID: ${{ github.event.client_payload.document_file_id || inputs.document_file_id || '' }}
      DOCUMENT_FILE_NAME: ${{ github.event.client_payload.document_file_name || inputs.document_file_name || '' }}
      DOCUMENT_MIME_TYPE: ${{ github.event.client_payload.document_mime_type || inputs.document_mime_type || '' }}
      BASE_BRANCH: main

    steps:
      - name: Validate payload
        run: |
          if [ -z "${TASK// /}" ]; then
            echo "::error::client_payload.task（またはworkflow_dispatchのtask）が空です。"
            exit 1
          fi

          echo "request_id: ${REQUEST_ID}"
          echo "chat_id:    ${CHAT_ID}"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Prepare working branch
        id: branch
        run: |
          SAFE_ID="$(printf '%s' "${REQUEST_ID}" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-40)"
          [ -n "${SAFE_ID}" ] || SAFE_ID="req"

          BRANCH="telegram-claude/${SAFE_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${BRANCH}"

          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "作業ブランチ: ${BRANCH}"

      - name: Write task instruction to file
        id: task_file
        run: |
          TASK_FILE="${RUNNER_TEMP}/telegram-task.md"
          REPORT_FILE="${RUNNER_TEMP}/claude-report.md"
          CONTROL_FILE="${RUNNER_TEMP}/github-control.json"

          printf '%s\n' "${TASK}" > "${TASK_FILE}"
          printf '%s\n' '{"action":"none","pr_number":null,"reason":""}' > "${CONTROL_FILE}"

          echo "path=${TASK_FILE}" >> "$GITHUB_OUTPUT"
          echo "report=${REPORT_FILE}" >> "$GITHUB_OUTPUT"
          echo "control=${CONTROL_FILE}" >> "$GITHUB_OUTPUT"

          echo "--- task ---"
          cat "${TASK_FILE}"

      - name: Download Telegram image attachment
        id: attachment
        if: env.PHOTO_FILE_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "::error::画像付き依頼ですが TELEGRAM_BOT_TOKEN が未設定です。"
            exit 1
          fi

          ATTACH_DIR="${RUNNER_TEMP}/telegram-attachment"
          mkdir -p "${ATTACH_DIR}"

          META_JSON="$(curl --fail-with-body --silent --show-error \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getFile?file_id=${PHOTO_FILE_ID}")"

          FILE_PATH="$(printf '%s' "${META_JSON}" | jq -r '.result.file_path // empty')"
          if [ -z "${FILE_PATH}" ]; then
            echo "::error::Telegram getFile から file_path を取得できませんでした。"
            exit 1
          fi

          EXT="${FILE_PATH##*.}"
          case "${EXT}" in
            jpg|jpeg|png|webp) ;;
            *) EXT="jpg" ;;
          esac

          SAFE_HINT="$(printf '%s' "${PHOTO_FILE_NAME}" | tr -c 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//' | cut -c1-80)"
          if [ -n "${SAFE_HINT}" ]; then
            case "${SAFE_HINT}" in
              *.*) FILE_NAME="${SAFE_HINT}" ;;
              *) FILE_NAME="${SAFE_HINT}.${EXT}" ;;
            esac
          else
            SAFE_ID="$(printf '%s' "${REQUEST_ID}" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-50)"
            FILE_NAME="telegram-${SAFE_ID}.${EXT}"
          fi

          LOCAL_PATH="${ATTACH_DIR}/${FILE_NAME}"
          curl --fail-with-body --silent --show-error \
            -o "${LOCAL_PATH}" \
            "https://api.telegram.org/file/bot${TELEGRAM_BOT_TOKEN}/${FILE_PATH}"

          if [ ! -s "${LOCAL_PATH}" ]; then
            echo "::error::Telegram画像のダウンロード結果が空です。"
            exit 1
          fi

          echo "path=${LOCAL_PATH}" >> "$GITHUB_OUTPUT"
          echo "name=${FILE_NAME}" >> "$GITHUB_OUTPUT"
          echo "画像を受け取りました: ${FILE_NAME}"
          file "${LOCAL_PATH}" || true

      - name: Download and safely prepare Telegram document attachment
        id: document_attachment
        if: env.DOCUMENT_FILE_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "::error::ファイル付き依頼ですが TELEGRAM_BOT_TOKEN が未設定です。"
            exit 1
          fi

          DOC_DIR="${RUNNER_TEMP}/telegram-document"
          EXTRACT_DIR="${RUNNER_TEMP}/telegram-document-extracted"
          mkdir -p "${DOC_DIR}" "${EXTRACT_DIR}"

          META_JSON="$(curl --fail-with-body --silent --show-error \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getFile?file_id=${DOCUMENT_FILE_ID}")"

          FILE_PATH="$(printf '%s' "${META_JSON}" | jq -r '.result.file_path // empty')"
          if [ -z "${FILE_PATH}" ]; then
            echo "::error::Telegram getFile から一般ファイルの file_path を取得できませんでした。"
            exit 1
          fi

          SAFE_HINT="$(printf '%s' "${DOCUMENT_FILE_NAME}" | tr -c 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//' | cut -c1-120)"
          if [ -n "${SAFE_HINT}" ]; then
            FILE_NAME="${SAFE_HINT}"
          else
            FILE_NAME="$(basename "${FILE_PATH}" | tr -c 'A-Za-z0-9._-' '-')"
          fi
          [ -n "${FILE_NAME}" ] || FILE_NAME="telegram-file"

          LOCAL_PATH="${DOC_DIR}/${FILE_NAME}"
          curl --fail-with-body --silent --show-error \
            -o "${LOCAL_PATH}" \
            "https://api.telegram.org/file/bot${TELEGRAM_BOT_TOKEN}/${FILE_PATH}"

          if [ ! -s "${LOCAL_PATH}" ]; then
            echo "::error::Telegram一般ファイルのダウンロード結果が空です。"
            exit 1
          fi

          # Runner保護。今回のデザイン素材には十分な上限を設け、巨大ファイルは止める。
          FILE_BYTES="$(wc -c < "${LOCAL_PATH}" | tr -d ' ')"
          MAX_FILE_BYTES=$((50 * 1024 * 1024))
          if [ "${FILE_BYTES}" -gt "${MAX_FILE_BYTES}" ]; then
            echo "::error::添付ファイルが50MBを超えているため安全のため停止しました。"
            exit 1
          fi

          IS_ZIP=false
          case "${FILE_NAME}" in
            *.zip|*.ZIP) IS_ZIP=true ;;
          esac
          if [ "${DOCUMENT_MIME_TYPE}" = "application/zip" ] || [ "${DOCUMENT_MIME_TYPE}" = "application/x-zip-compressed" ]; then
            IS_ZIP=true
          fi

          if [ "${IS_ZIP}" = "true" ]; then
            ZIP_PATH="${LOCAL_PATH}" EXTRACT_DIR="${EXTRACT_DIR}" python3 - <<'PY'
          import os
          import stat
          import zipfile
          from pathlib import Path

          zip_path = Path(os.environ["ZIP_PATH"])
          extract_dir = Path(os.environ["EXTRACT_DIR"]).resolve()
          max_files = 1000
          max_total = 150 * 1024 * 1024

          with zipfile.ZipFile(zip_path) as zf:
              infos = zf.infolist()
              if len(infos) > max_files:
                  raise SystemExit(f"ZIP内ファイル数が上限({max_files})を超えています。")

              total = 0
              for info in infos:
                  total += int(info.file_size or 0)
                  if total > max_total:
                      raise SystemExit("ZIP展開後サイズが150MBを超えるため停止しました。")

                  mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"ZIP内のシンボリックリンクは禁止です: {info.filename}")

                  target = (extract_dir / info.filename).resolve()
                  if target != extract_dir and extract_dir not in target.parents:
                      raise SystemExit(f"危険なZIPパスを検出しました: {info.filename}")

              zf.extractall(extract_dir)
          PY
            echo "is_archive=true" >> "$GITHUB_OUTPUT"
            echo "extract_dir=${EXTRACT_DIR}" >> "$GITHUB_OUTPUT"
            echo "ZIPを安全に展開しました: ${EXTRACT_DIR}"
          else
            echo "is_archive=false" >> "$GITHUB_OUTPUT"
            echo "extract_dir=" >> "$GITHUB_OUTPUT"
          fi

          echo "path=${LOCAL_PATH}" >> "$GITHUB_OUTPUT"
          echo "name=${FILE_NAME}" >> "$GITHUB_OUTPUT"
          echo "mime_type=${DOCUMENT_MIME_TYPE}" >> "$GITHUB_OUTPUT"
          echo "一般ファイルを受け取りました: ${FILE_NAME} (${FILE_BYTES} bytes)"
          file "${LOCAL_PATH}" || true

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowed-tools
            "Read,Glob,Grep,Edit,MultiEdit,Write,
            Bash(git status:*),Bash(git diff:*),Bash(git log:*),
            Bash(ls:*),Bash(node:*),Bash(npx:*),Bash(python3:*),Bash(curl:*),
            Bash(cp:*),Bash(file:*),Bash(mkdir:*)"
            --max-turns 100
          prompt: |
            あなたはこのSEOサイトのGitHubリポジトリを扱うClaude Code Agentです。

            まず、リポジトリ直下の `CLAUDE.md` と、Telegramから渡された作業指示ファイルを読んでください。

            作業指示:
            ${{ steps.task_file.outputs.path }}

            Telegram画像ファイル（添付がある場合のみ）:
            ${{ steps.attachment.outputs.path }}

            画像パスが空でなければ、そのファイルはユーザーが今回Telegramで添付した実ファイルです。
            必要なら `file` で確認し、依頼を成立させるために `cp` でリポジトリ内へ追加して使用してください。
            画像ファイル名や保存先は現物確認後に自然な名前を選び、存在しない画像名を推測して参照しないでください。
            画像パスが空なら「画像が届いている」と仮定しないでください。

            Telegram一般ファイル（添付がある場合のみ）:
            ${{ steps.document_attachment.outputs.path }}

            一般ファイル名:
            ${{ steps.document_attachment.outputs.name }}

            ZIP等の安全展開先（アーカイブの場合のみ）:
            ${{ steps.document_attachment.outputs.extract_dir }}

            一般ファイルパスが空でなければ、ユーザーが今回Telegramで添付した実ファイルです。
            展開先が空でなければ、安全検査済みのZIP展開内容です。まず展開内容を確認し、依頼に必要なファイルだけを使用してください。
            Claude Design等のバンドル/書き出し素材は、そのまま本番ファイルへ丸ごと置換せず、現行Repoの構造・SEO・canonical・リンク・既存機能を確認して必要部分を移植してください。
            添付素材そのものや展開一式を無条件にRepoへ保存せず、本番実装に必要なコード/画像/アセットだけを自然な配置へコピーしてください。
            一般ファイルパスが空なら「ファイルが届いている」と仮定しないでください。

            必要な場合のみ、次の補助ファイルを参照してください。

            - `bot-capabilities.md`
            - `bot-handoff.md`
            - `auto-checklist.md`

            ## 基本原則

            1. ユーザーの表面的な文言だけでなく、渡された文脈から最終目的を理解する。
            2. 推測より現物確認を優先し、Read / Glob / Grep / Bash / curl等から必要なツールを自分で選ぶ。
            3. ユーザーが依頼した範囲と、その目的を正しく成立させるために必要な範囲だけ作業する。曖昧な依頼を勝手にサイト全体監査へ拡大しない。
            4. 小さなタスクは現状確認後すぐ実行し、大きなタスクは軽く計画してから進める。
            5. 調査のみの依頼ではリポジトリを変更しない。修正依頼では必要なファイルだけを変更する。
            6. 実行後は結果を観測し、必要な検証を自分で選んで行う。
            7. 依頼範囲内の問題を見つけ、安全に直せる場合は自分で修正し、再検証する。
            8. 確認できない情報を事実のように断定しない。
            9. mainへの直接pushは行わない。Production反映は、検証済みPRをmainへマージする既存のデプロイ経路だけを使用する。
            10. 最後に、ユーザーが判断できる短い作業レポートを作る。求められていない全件一覧・長い検証ログ・重複説明は出さない。

            ## Git操作

            通常のコード変更では、branch作成・commit・push・PR作成・mainへのマージ実行はGitHub Actions側が担当します。
            Claude Codeは変更内容の調査・編集・検証・自己レビューと、マージ可否の判断を担当します。
            Claude Code自身は以下を行わないでください。

            - git commit
            - git push
            - git branch操作
            - PR作成
            - mainへの直接変更
            - ghによる直接PR操作
            - Cloudflare / Productionへの直接デプロイ操作

            状態確認のための `git status` / `git diff` / `git log` は使用して構いません。

            通常の修正依頼では、作業完了後に差分と検証結果を自己レビューしてください。
            意図した変更だけで、必要な検証に合格し、未解決の重大な問題がなく、
            ユーザーが「PRまで」「マージしない」「確認後にマージ」等を指定していない場合は、
            制御ファイルへ `auto_merge_after_pr` を書き出してください。
            これにより、後段のGitHub ActionsがPR作成後に状態を再確認し、mainへマージします。

            既存PRについてユーザーが明示的にGitHub操作を依頼した場合も、
            Claude Codeが直接操作するのではなく、次の制御ファイルへ指示を書き出してください。

            制御ファイル:
            ${{ steps.task_file.outputs.control }}

            JSON形式は必ず次のいずれかです。

            - 通常タスク（自動マージしない）: {"action":"none","pr_number":null,"reason":""}
            - 今回作成するPRを検証後に自動マージ: {"action":"auto_merge_after_pr","pr_number":null,"reason":"検証完了・自動マージ可能と判断した短い理由"}
            - 既存PRを閉じる: {"action":"close_pr","pr_number":24,"reason":"短い理由"}
            - 既存PRをマージ: {"action":"merge_pr","pr_number":24,"reason":"短い理由"}
            - 既存PRを元に戻す: {"action":"revert_pr","pr_number":24,"reason":"短い理由"}

            ルール:

            1. 通常の修正依頼は、差分確認・必要な検証・自己レビューまで完了し、安全にmainへ反映できると判断した場合 `auto_merge_after_pr` を指定する。
            2. ユーザーが「PRまで」「マージしない」「Previewで確認したい」「確認後にマージ」等を指定した場合は `auto_merge_after_pr` を使わず action=none とする。
            3. 未解決のエラー、重大な警告、意図不明の差分、検証不足、ユーザー判断が必要な事項が残る場合は action=none とする。
            4. close_pr / merge_pr / revert_pr は、既存PRについてユーザーが今回の依頼で明確にその操作を求めている場合だけ指定する。
            5. 既存PR番号を推測しない。対象PRを特定できない場合は action=none とし、作業レポートでPR番号の確認を1つだけ求める。
            6. merge_pr は既存PRに対して「マージして」「mergeして」等の明示指示がある場合だけ指定する。
            7. revert_pr は「元に戻して」「取り消して」「revertして」等、既存PRの変更を戻す明示指示がある場合だけ指定する。
            8. GitHub管理操作だけの依頼では、リポジトリファイルを編集しない。
            9. Secret変更、main直接push、Cloudflareへの直接デプロイは制御ファイルでも要求しない。
            10. 不明な場合は危険側へ推測せず action=none とする。

            ## セキュリティ

            Secret、Token、APIキー等を表示しないでください。
            `CLAUDE.md` の禁止事項・サイト固有ルールは必ず守ってください。

            ## 作業レポート

            最後に、次のファイルへ日本語Markdownで作業レポートを書き出してください。

            ${{ steps.task_file.outputs.report }}

            レポートは原則1200文字以内、最大でも次の4項目だけにしてください。

            - 結論 / 結果
            - 変更したもの（ある場合のみ）
            - 検証結果（重要なものだけ）
            - 次にユーザーがすること（必要な場合のみ）

            ユーザーが明示的に一覧・詳細レポートを求めた場合だけ詳細化してください。
            通常タスクでは、全ファイル一覧、全リンク一覧、長い調査手順、同じ内容の言い換えを出さないでください。
            作業不能の場合も「止まった理由1つ + 次に必要なこと1つ」を短く返してください。
            「後で提示します」で終了せず、この実行内で必要な成果まで完成させてください。

      - name: Execute explicit GitHub PR control request
        id: github_control
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_FILE: ${{ steps.task_file.outputs.control }}
          REPORT_FILE: ${{ steps.task_file.outputs.report }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail

          echo "executed=false" >> "$GITHUB_OUTPUT"
          echo "action=none" >> "$GITHUB_OUTPUT"
          echo "auto_merge=false" >> "$GITHUB_OUTPUT"
          echo "pr_url=" >> "$GITHUB_OUTPUT"

          if [ ! -s "${CONTROL_FILE}" ]; then
            echo "GitHub制御ファイルがないため通常タスクとして続行します。"
            exit 0
          fi

          if ! jq -e . "${CONTROL_FILE}" >/dev/null 2>&1; then
            echo "::error::GitHub制御ファイルが正しいJSONではありません。"
            exit 1
          fi

          ACTION="$(jq -r '.action // "none"' "${CONTROL_FILE}")"
          PR_NUMBER="$(jq -r '.pr_number // empty' "${CONTROL_FILE}")"

          case "${ACTION}" in
            none)
              exit 0
              ;;
            auto_merge_after_pr)
              echo "action=auto_merge_after_pr" >> "$GITHUB_OUTPUT"
              echo "auto_merge=true" >> "$GITHUB_OUTPUT"
              echo "Claude Codeが今回作成するPRを検証後に自動マージ可能と判断しました。"
              exit 0
              ;;
            close_pr|merge_pr|revert_pr)
              ;;
            *)
              echo "::error::未対応のGitHub操作です: ${ACTION}"
              exit 1
              ;;
          esac

          if ! printf '%s' "${PR_NUMBER}" | grep -Eq '^[0-9]+$'; then
            echo "::error::既存PRのGitHub操作には正しいPR番号が必要です。"
            exit 1
          fi

          # Claudeの判断だけで破壊的操作へ進まないため、元の依頼文にも明示語があることを確認する。
          case "${ACTION}" in
            merge_pr)
              if ! printf '%s' "${TASK}" | grep -Eqi 'マージ|merge'; then
                echo "::error::merge_pr が指定されましたが、元の依頼文に明示的なマージ指示がありません。"
                exit 1
              fi
              ;;
            close_pr)
              if ! printf '%s' "${TASK}" | grep -Eqi 'close|クローズ|閉じ|取り下げ|消して|削除'; then
                echo "::error::close_pr が指定されましたが、元の依頼文に明示的なClose指示がありません。"
                exit 1
              fi
              ;;
            revert_pr)
              if ! printf '%s' "${TASK}" | grep -Eqi 'revert|リバート|元に戻|取り消|戻して|巻き戻'; then
                echo "::error::revert_pr が指定されましたが、元の依頼文に明示的なRevert指示がありません。"
                exit 1
              fi
              ;;
          esac

          PR_JSON="$(gh pr view "${PR_NUMBER}" --json number,state,mergedAt,url,mergeCommit,headRefName,baseRefName)"
          PR_STATE="$(printf '%s' "${PR_JSON}" | jq -r '.state')"
          MERGED_AT="$(printf '%s' "${PR_JSON}" | jq -r '.mergedAt // empty')"
          PR_URL="$(printf '%s' "${PR_JSON}" | jq -r '.url')"

          echo "action=${ACTION}" >> "$GITHUB_OUTPUT"
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

          case "${ACTION}" in
            close_pr)
              if [ -n "${MERGED_AT}" ]; then
                printf '%s\n' \
                  "対応できませんでした。" \
                  "PR #${PR_NUMBER} はすでにマージ済みのためCloseでは取り消せません。元に戻す場合はRevertを依頼してください。" \
                  > "${REPORT_FILE}"
                echo "executed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              if [ "${PR_STATE}" = "OPEN" ]; then
                gh pr close "${PR_NUMBER}"
                printf '%s\n' \
                  "対応完了。" \
                  "PR #${PR_NUMBER} をCloseしました。" \
                  "${PR_URL}" \
                  > "${REPORT_FILE}"
              else
                printf '%s\n' \
                  "確認完了。" \
                  "PR #${PR_NUMBER} はすでにCloseされています。追加操作はしていません。" \
                  "${PR_URL}" \
                  > "${REPORT_FILE}"
              fi
              echo "executed=true" >> "$GITHUB_OUTPUT"
              ;;

            merge_pr)
              if [ -n "${MERGED_AT}" ]; then
                printf '%s\n' \
                  "確認完了。" \
                  "PR #${PR_NUMBER} はすでにマージ済みです。追加操作はしていません。" \
                  "${PR_URL}" \
                  > "${REPORT_FILE}"
                echo "executed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              if [ "${PR_STATE}" != "OPEN" ]; then
                printf '%s\n' \
                  "マージできませんでした。" \
                  "PR #${PR_NUMBER} はOPEN状態ではありません。" \
                  "${PR_URL}" \
                  > "${REPORT_FILE}"
                echo "executed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              # 明示依頼でのみここへ到達する。Branch protection / required checksはGitHub側に従う。
              gh pr merge "${PR_NUMBER}" --merge
              printf '%s\n' \
                "対応完了。" \
                "PR #${PR_NUMBER} をマージしました。" \
                "Production反映はこのWorkflowでは行っていません。" \
                "${PR_URL}" \
                > "${REPORT_FILE}"
              echo "executed=true" >> "$GITHUB_OUTPUT"
              ;;

            revert_pr)
              if [ -z "${MERGED_AT}" ]; then
                if [ "${PR_STATE}" = "OPEN" ]; then
                  gh pr close "${PR_NUMBER}"
                  printf '%s\n' \
                    "対応完了。" \
                    "PR #${PR_NUMBER} はまだマージされていなかったため、RevertではなくPRをCloseしました。" \
                    "mainには変更が入っていないためRevert PRは不要です。" \
                    "${PR_URL}" \
                    > "${REPORT_FILE}"
                else
                  printf '%s\n' \
                    "確認完了。" \
                    "PR #${PR_NUMBER} は未マージかつClose済みです。mainへ変更は入っていないため追加操作は不要です。" \
                    "${PR_URL}" \
                    > "${REPORT_FILE}"
                fi
                echo "executed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              MERGE_OID="$(printf '%s' "${PR_JSON}" | jq -r '.mergeCommit.oid // empty')"
              if [ -z "${MERGE_OID}" ]; then
                echo "::error::PR #${PR_NUMBER} のmerge commitを取得できませんでした。"
                exit 1
              fi

              git fetch origin "${BASE_BRANCH}"
              git reset --hard "origin/${BASE_BRANCH}"
              git switch -C "${BRANCH}"

              # Merge commitならmainline指定、Squash等の通常commitなら通常Revert。
              PARENT_COUNT="$(git rev-list --parents -n 1 "${MERGE_OID}" | awk '{print NF-1}')"
              if [ "${PARENT_COUNT}" -ge 2 ]; then
                REVERT_CMD=(git revert -m 1 --no-commit "${MERGE_OID}")
              else
                REVERT_CMD=(git revert --no-commit "${MERGE_OID}")
              fi

              # commitは後段の共通Commit stepに任せる。
              if ! "${REVERT_CMD[@]}"; then
                git revert --abort || true
                echo "::error::PR #${PR_NUMBER} のRevert差分を作成できませんでした。競合の可能性があります。"
                exit 1
              fi

              printf '%s\n' \
                "Revert差分を作成しました。" \
                "対象: PR #${PR_NUMBER}" \
                "この後、安全なRevert PRを自動作成します。本番への再反映は自動では行いません。" \
                > "${REPORT_FILE}"
              echo "executed=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Discard accidental repo edits for PR-only controls
        if: steps.github_control.outputs.action == 'close_pr' || steps.github_control.outputs.action == 'merge_pr'
        run: |
          git reset --hard HEAD
          git clean -fd

      - name: Detect changes
        id: changes
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "変更はありません。commit、push、PR作成をスキップします。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"

            {
              echo "files<<CHANGED_FILES_EOF"
              git diff --cached --name-status
              echo "CHANGED_FILES_EOF"
            } >> "$GITHUB_OUTPUT"

            {
              echo "stat<<DIFFSTAT_EOF"
              git diff --cached --stat
              echo "DIFFSTAT_EOF"
            } >> "$GITHUB_OUTPUT"

            git diff --cached --stat
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git commit             -m "chore(telegram-agent): apply requested changes"             -m "request_id: ${REQUEST_ID}"             -m "chat_id: ${CHAT_ID}"

      - name: Push working branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          case "${BRANCH}" in
            main|master|"")
              echo "::error::mainへの直接pushは禁止されています。"
              exit 1
              ;;
          esac

          git remote set-url origin             "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push --set-upstream origin             "refs/heads/${BRANCH}:refs/heads/${BRANCH}"

      - name: Create Pull Request
        id: create_pr
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          CHANGED_FILES: ${{ steps.changes.outputs.files }}
          DIFFSTAT: ${{ steps.changes.outputs.stat }}
          TASK_FILE: ${{ steps.task_file.outputs.path }}
          REPORT_FILE: ${{ steps.task_file.outputs.report }}
        run: |
          BODY_FILE="${RUNNER_TEMP}/pr-body.md"

          {
            echo "## リクエスト情報"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| request_id | \`${REQUEST_ID}\` |"
            echo "| chat_id | \`${CHAT_ID}\` |"
            echo "| 作業ブランチ | \`${BRANCH}\` |"
            echo "| ワークフロー実行 | [#${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo ""
            echo "## 作業指示"
            echo ""
            echo '```text'
            cat "${TASK_FILE}"
            echo '```'
            echo ""
            echo "## 変更ファイル"
            echo ""
            echo '```'
            printf '%s\n' "${CHANGED_FILES}"
            echo '```'
            echo ""
            echo "### 差分サマリ"
            echo ""
            echo '```'
            printf '%s\n' "${DIFFSTAT}"
            echo '```'
            echo ""
            echo "## Claude Code作業レポート"
            echo ""
            if [ -s "${REPORT_FILE}" ]; then
              cat "${REPORT_FILE}"
            else
              echo "_レポートファイルが生成されませんでした。Actionsログを確認してください。_"
            fi
            echo ""
            echo "---"
            echo ""
            if [ "${{ steps.github_control.outputs.auto_merge }}" = "true" ]; then
              echo "> Claude Codeの自己レビューで自動マージ可能と判断されたため、PR作成後にGitHub Actionsがチェックを確認してmainへマージします。"
            else
              echo "> このPRは自動マージ対象ではありません。必要に応じて内容を確認してからマージしてください。"
            fi
          } > "${BODY_FILE}"

          TASK_SNIPPET="$(head -n 1 "${TASK_FILE}" | cut -c1-60)"
          [ -n "${TASK_SNIPPET}" ] || TASK_SNIPPET="${REQUEST_ID}"

          if [ "${{ steps.github_control.outputs.action }}" = "revert_pr" ]; then
            PR_TITLE="[Telegram Claude Agent] Revert requested PR"
          else
            PR_TITLE="[Telegram Claude Agent] ${TASK_SNIPPET}"
          fi

          gh pr create             --base "${BASE_BRANCH}"             --head "${BRANCH}"             --title "${PR_TITLE}"             --body-file "${BODY_FILE}"

          PR_URL="$(gh pr view "${BRANCH}" --json url --jq .url)"

          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "PR: ${PR_URL}"

          {
            echo "### Telegram Claude Agent"
            echo ""
            echo "- request_id: \`${REQUEST_ID}\`"
            echo "- chat_id: \`${CHAT_ID}\`"
            echo "- PR: ${PR_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate and auto-merge Pull Request
        id: auto_merge
        if: steps.changes.outputs.changed == 'true' && steps.github_control.outputs.auto_merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
          REPORT_FILE: ${{ steps.task_file.outputs.report }}
        run: |
          set -euo pipefail

          echo "merged=false" >> "$GITHUB_OUTPUT"
          echo "pr_number=" >> "$GITHUB_OUTPUT"

          if [ -z "${PR_URL}" ]; then
            echo "::error::自動マージ対象ですがPR URLを取得できませんでした。"
            exit 1
          fi

          PR_NUMBER="$(gh pr view "${PR_URL}" --json number --jq .number)"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

          # PR作成後の実状態を再確認する。
          PR_JSON="$(gh pr view "${PR_NUMBER}" --json state,isDraft,baseRefName,mergeable,mergeStateStatus,url)"
          PR_STATE="$(printf '%s' "${PR_JSON}" | jq -r '.state')"
          IS_DRAFT="$(printf '%s' "${PR_JSON}" | jq -r '.isDraft')"
          BASE_REF="$(printf '%s' "${PR_JSON}" | jq -r '.baseRefName')"

          [ "${PR_STATE}" = "OPEN" ] || { echo "::error::PR #${PR_NUMBER} がOPENではありません。"; exit 1; }
          [ "${IS_DRAFT}" = "false" ] || { echo "::error::PR #${PR_NUMBER} はDraftのため自動マージしません。"; exit 1; }
          [ "${BASE_REF}" = "${BASE_BRANCH}" ] || { echo "::error::PR #${PR_NUMBER} のbaseが${BASE_BRANCH}ではありません。"; exit 1; }

          # GitHub上のcheck runがある場合は完了まで待つ。
          # checkが1件もない場合は、そのままbranch protectionの判定へ進む。
          for i in $(seq 1 60); do
            CHECKS="$(gh pr view "${PR_NUMBER}" --json statusCheckRollup --jq '.statusCheckRollup')"
            TOTAL="$(printf '%s' "${CHECKS}" | jq 'length')"

            if [ "${TOTAL}" -eq 0 ]; then
              echo "PRにcheck runはありません。GitHubのmerge可否判定へ進みます。"
              break
            fi

            PENDING="$(printf '%s' "${CHECKS}" | jq '[.[] | select((.status // "") != "COMPLETED")] | length')"
            FAILED="$(printf '%s' "${CHECKS}" | jq '[.[] | select((.status // "") == "COMPLETED" and ((.conclusion // "") != "SUCCESS" and (.conclusion // "") != "NEUTRAL" and (.conclusion // "") != "SKIPPED"))] | length')"

            if [ "${FAILED}" -gt 0 ]; then
              echo "::error::PR #${PR_NUMBER} に失敗したcheckがあります。自動マージを停止します。"
              printf '%s\n' "${CHECKS}" | jq .
              exit 1
            fi

            if [ "${PENDING}" -eq 0 ]; then
              echo "すべてのcheckが完了しました。"
              break
            fi

            if [ "${i}" -eq 60 ]; then
              echo "::error::PR #${PR_NUMBER} のcheck完了待ちがタイムアウトしました。"
              exit 1
            fi

            echo "check完了待ち... (${i}/60)"
            sleep 10
          done

          # 最新mainとの競合・GitHub側のマージ可否を再確認する。
          PR_JSON="$(gh pr view "${PR_NUMBER}" --json state,isDraft,baseRefName,mergeable,mergeStateStatus,url)"
          MERGEABLE="$(printf '%s' "${PR_JSON}" | jq -r '.mergeable')"
          MERGE_STATE="$(printf '%s' "${PR_JSON}" | jq -r '.mergeStateStatus')"

          if [ "${MERGEABLE}" = "CONFLICTING" ]; then
            echo "::error::PR #${PR_NUMBER} はmainと競合しているため自動マージしません。"
            exit 1
          fi

          case "${MERGE_STATE}" in
            BLOCKED|DIRTY)
              echo "::error::PR #${PR_NUMBER} はGitHub側でマージがブロックされています (${MERGE_STATE})。"
              exit 1
              ;;
          esac

          # mainへ直接pushせず、必ずPR経由でマージする。
          # Branch protection / required reviews / required checksはGitHub側のルールを尊重する。
          gh pr merge "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --merge \
            --delete-branch

          MERGED_JSON="$(gh pr view "${PR_NUMBER}" --json mergedAt,url,mergeCommit)"
          MERGED_AT="$(printf '%s' "${MERGED_JSON}" | jq -r '.mergedAt // empty')"
          PR_FINAL_URL="$(printf '%s' "${MERGED_JSON}" | jq -r '.url')"

          if [ -z "${MERGED_AT}" ]; then
            echo "::error::PR #${PR_NUMBER} のマージ完了を確認できませんでした。"
            exit 1
          fi

          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "pr_url=${PR_FINAL_URL}" >> "$GITHUB_OUTPUT"

          {
            echo ""
            echo "## 自動マージ"
            echo "- PR #${PR_NUMBER} をmainへマージしました。"
            echo "- PR: ${PR_FINAL_URL}"
            echo "- main更新により、既存のCloudflare Pages Productionデプロイ対象になります。"
          } >> "${REPORT_FILE}"

          {
            echo ""
            echo "### Auto merge"
            echo "- PR: ${PR_FINAL_URL}"
            echo "- Result: merged to \`${BASE_BRANCH}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No changes summary
        if: steps.changes.outputs.changed != 'true'
        run: |
          {
            echo "### Telegram Claude Agent"
            echo ""
            echo "- request_id: \`${REQUEST_ID}\`"
            echo "- chat_id: \`${CHAT_ID}\`"
            echo "- 結果: ファイル変更なし。調査・確認、またはPR管理操作のみの場合は正常な結果です。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send final result to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANGED: ${{ steps.changes.outputs.changed }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
          AUTO_MERGED: ${{ steps.auto_merge.outputs.merged }}
          AUTO_MERGE_PR_NUMBER: ${{ steps.auto_merge.outputs.pr_number }}
          REPORT_FILE: ${{ steps.task_file.outputs.report }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKENが未設定のため通知をスキップします。"
            exit 0
          fi

          if [ -z "${CHAT_ID}" ] || [ "${CHAT_ID}" = "manual" ]; then
            echo "手動実行のためTelegram通知をスキップします。"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]
          changed = os.environ.get("CHANGED", "false") == "true"
          pr_url = os.environ.get("PR_URL", "").strip()
          auto_merged = os.environ.get("AUTO_MERGED", "false") == "true"
          auto_merge_pr_number = os.environ.get("AUTO_MERGE_PR_NUMBER", "").strip()
          report_path = Path(os.environ["REPORT_FILE"])

          if report_path.exists() and report_path.stat().st_size > 0:
              report = report_path.read_text(encoding="utf-8", errors="replace").strip()
          else:
              report = "処理は完了しましたが、作業レポートを取得できませんでした。"

          # Telegramは詳細ログ置き場ではない。通常は短い結論だけ返す。
          limit = 1800
          if len(report) > limit:
              report = report[:limit].rstrip() + "\n…（詳細はPR / Actionsで確認できます）"

          if changed:
              if auto_merged:
                  headline = "対応完了。PRをmainへ自動マージしました。"
                  if auto_merge_pr_number:
                      headline += f" (PR #{auto_merge_pr_number})"
                  parts = [headline, report]
                  if pr_url:
                      parts.append(f"マージ済みPR:\n{pr_url}")
              else:
                  parts = ["対応完了。", report]
                  if pr_url:
                      parts.append(f"確認用PR:\n{pr_url}")
          else:
              parts = ["確認完了。", report]

          text = "\n\n".join(part for part in parts if part).strip()
          api_url = f"https://api.telegram.org/bot{token}/sendMessage"
          payload = json.dumps({
              "chat_id": chat_id,
              "text": text,
              "disable_web_page_preview": True,
          }, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(
              api_url,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              response.read()
          PY

      - name: Send failure result to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKENが未設定のため失敗通知をスキップします。"
            exit 0
          fi

          if [ -z "${CHAT_ID}" ] || [ "${CHAT_ID}" = "manual" ]; then
            echo "手動実行のためTelegram通知をスキップします。"
            exit 0
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          MESSAGE="$(printf '%s\n\n%s\n%s' \
            '処理中にエラーが発生しました。' \
            'GitHub Actions:' \
            "${RUN_URL}")"

          PAYLOAD="$(jq -n             --arg chat_id "${CHAT_ID}"             --arg text "${MESSAGE}"             '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}')"

          curl --fail-with-body --silent --show-error             -X POST             -H "Content-Type: application/json"             -d "${PAYLOAD}"             "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
