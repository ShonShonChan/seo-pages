name: Telegram Production Deploy

# Telegram から明示的に本番反映を指示されたときだけ起動する。
# main へ直接 push せず、Telegram Claude Agent の通常PR、またはTelegram Rollback Prepareの正規Revert PRをPR経由でマージする。
# 通常PR/Revert PRの由来検証、必須チェック0件/pending、set -e、mergeable未計算、再実行、merge queue、公開反映遅延を考慮する。

on:
  repository_dispatch:
    types: [telegram_production_deploy]

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read
  statuses: read
  deployments: read

concurrency:
  group: telegram-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, merge and verify deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CHAT_ID: ${{ github.event.client_payload.chat_id }}
      REQUEST_ID: ${{ github.event.client_payload.request_id }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      PUBLIC_URL: https://revenge-casino-guide.com
      FAILURE_STAGE: initialization
      MERGE_COMPLETED: "false"
      ALREADY_MERGED: "false"

    steps:
      - name: Initialize state
        shell: bash
        run: |
          set -euo pipefail
          echo "FAILURE_STAGE=payload_validation" >> "${GITHUB_ENV}"
          echo "MERGE_COMPLETED=false" >> "${GITHUB_ENV}"
          echo "ALREADY_MERGED=false" >> "${GITHUB_ENV}"

      - name: Validate payload
        shell: bash
        run: |
          set -euo pipefail

          if ! printf '%s' "${PR_NUMBER}" | grep -Eq '^[0-9]+$'; then
            echo "::error::pr_number が不正です。"
            exit 1
          fi

          if [ -z "${CHAT_ID}" ]; then
            echo "::error::chat_id が空です。"
            exit 1
          fi

          echo "FAILURE_STAGE=pr_validation" >> "${GITHUB_ENV}"

      - name: Validate target PR
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # GitHub が mergeable をまだ計算していない場合があるため、最大30秒待つ。
          PR_JSON=""
          for attempt in $(seq 1 6); do
            PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            MERGEABLE="$(printf '%s' "${PR_JSON}" | jq -r '.mergeable')"
            if [ "${MERGEABLE}" != "null" ]; then
              break
            fi
            sleep 5
          done

          STATE="$(printf '%s' "${PR_JSON}" | jq -r '.state')"
          DRAFT="$(printf '%s' "${PR_JSON}" | jq -r '.draft')"
          MERGED="$(printf '%s' "${PR_JSON}" | jq -r '.merged')"
          BASE="$(printf '%s' "${PR_JSON}" | jq -r '.base.ref')"
          TITLE="$(printf '%s' "${PR_JSON}" | jq -r '.title')"
          PR_URL="$(printf '%s' "${PR_JSON}" | jq -r '.html_url')"
          HEAD_SHA="$(printf '%s' "${PR_JSON}" | jq -r '.head.sha')"
          HEAD_REF="$(printf '%s' "${PR_JSON}" | jq -r '.head.ref')"
          HEAD_REPO="$(printf '%s' "${PR_JSON}" | jq -r '.head.repo.full_name // ""')"
          MERGEABLE="$(printf '%s' "${PR_JSON}" | jq -r '.mergeable')"
          MERGEABLE_STATE="$(printf '%s' "${PR_JSON}" | jq -r '.mergeable_state // "unknown"')"

          [ "${BASE}" = "main" ] || { echo "::error::main 向け PR ではありません。"; exit 1; }
          [ "${DRAFT}" = "false" ] || { echo "::error::Draft PR は本番反映できません。"; exit 1; }

          # Telegram から自動本番反映できるPRは、次の2種類だけに限定する。
          # 1) Telegram Claude Agent が作成した通常修正PR
          # 2) Telegram Rollback Prepare が作成した正規Revert PR
          # 単にタイトルが似ているだけのPRや外部forkは許可しない。
          PR_KIND=""
          SOURCE_PR_NUMBER=""

          case "${HEAD_REF}" in
            telegram-claude/*)
              case "${TITLE}" in
                "[Telegram Claude Agent]"*) PR_KIND="agent" ;;
                *) echo "::error::Telegram Claude Agentブランチですが、想定タイトルではありません。"; exit 1 ;;
              esac
              ;;
            telegram-revert/*)
              if printf '%s' "${TITLE}" | grep -Eq '^\[Telegram Claude Agent\] Revert PR #[0-9]+$'; then
                PR_KIND="revert"
                SOURCE_PR_NUMBER="$(printf '%s' "${TITLE}" | sed -n 's/^\[Telegram Claude Agent\] Revert PR #\([0-9][0-9]*\)$/\1/p')"
              else
                echo "::error::Revert PRのタイトル形式が正規のRollback Workflow形式ではありません。"
                exit 1
              fi
              ;;
            *)
              echo "::error::Telegram Claude Agent / Telegram Rollback Prepare の作業ブランチではありません。"
              exit 1
              ;;
          esac

          if [ "${HEAD_REPO}" != "${GITHUB_REPOSITORY}" ]; then
            echo "::error::外部 fork の PR は Telegram から本番反映できません。"
            exit 1
          fi

          # Revert PRは、元PRまでたどって正規のロールバック由来か追加検証する。
          if [ "${PR_KIND}" = "revert" ]; then
            if ! printf '%s' "${SOURCE_PR_NUMBER}" | grep -Eq '^[0-9]+$'; then
              echo "::error::Revert元PR番号を取得できませんでした。"
              exit 1
            fi

            SOURCE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${SOURCE_PR_NUMBER}")"
            SOURCE_MERGED="$(printf '%s' "${SOURCE_JSON}" | jq -r '.merged')"
            SOURCE_BASE="$(printf '%s' "${SOURCE_JSON}" | jq -r '.base.ref')"
            SOURCE_TITLE="$(printf '%s' "${SOURCE_JSON}" | jq -r '.title')"
            SOURCE_HEAD_REPO="$(printf '%s' "${SOURCE_JSON}" | jq -r '.head.repo.full_name // ""')"

            [ "${SOURCE_MERGED}" = "true" ] || { echo "::error::Revert元PRはマージ済みではありません。"; exit 1; }
            [ "${SOURCE_BASE}" = "main" ] || { echo "::error::Revert元PRはmain向けではありません。"; exit 1; }
            [ "${SOURCE_HEAD_REPO}" = "${GITHUB_REPOSITORY}" ] || { echo "::error::Revert元PRが外部fork由来です。"; exit 1; }
            case "${SOURCE_TITLE}" in
              "[Telegram Claude Agent]"*) ;;
              *) echo "::error::Revert元PRはTelegram系PRではありません。"; exit 1 ;;
            esac

            # Rollback Prepare Workflowが書く本文マーカーも確認する。
            PR_BODY="$(printf '%s' "${PR_JSON}" | jq -r '.body // ""')"
            if ! printf '%s' "${PR_BODY}" | grep -Fq -- "- 元PR: #${SOURCE_PR_NUMBER}"; then
              echo "::error::Revert PR本文に元PR情報がなく、正規Rollback Workflow由来と確認できません。"
              exit 1
            fi
          fi

          if [ "${MERGED}" = "true" ]; then
            echo "ALREADY_MERGED=true" >> "${GITHUB_ENV}"
            echo "MERGE_COMPLETED=true" >> "${GITHUB_ENV}"
          elif [ "${STATE}" != "open" ]; then
            echo "::error::PR は open ではなく、かつ merged でもありません。"
            exit 1
          fi

          if [ "${MERGED}" != "true" ]; then
            if [ "${MERGEABLE}" = "false" ]; then
              echo "::error::PR にマージ競合があります。"
              exit 1
            fi

            case "${MERGEABLE_STATE}" in
              dirty)
                echo "::error::PR に競合があるため停止します。"
                exit 1
                ;;
            esac
          fi

          # 変更対象を保存。後続の危険ファイル確認と公開内容照合で使う。
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' > /tmp/pr-files.txt

          FILE_COUNT="$(wc -l < /tmp/pr-files.txt | tr -d ' ')"
          if [ "${FILE_COUNT}" -eq 0 ]; then
            echo "::error::変更ファイルがありません。"
            exit 1
          fi

          if [ "${FILE_COUNT}" -gt 50 ]; then
            echo "::error::変更ファイルが ${FILE_COUNT} 件あります。Telegram の1ステップ本番反映対象としては大きすぎるため停止します。"
            exit 1
          fi

          # Workflow・BOT設定・秘密情報に関わるファイルは、通常のサイト更新と分離する。
          # これらを変更する PR は手動確認を要求する。
          if grep -Eq '^(\.github/|wrangler\.toml$|wrangler\.jsonc$|package\.json$|package-lock\.json$|CLAUDE\.md$|bot-capabilities\.md$)' /tmp/pr-files.txt; then
            echo "::error::運用設定・Workflow・BOTルール等の重要ファイルが含まれています。手動確認が必要です。"
            cat /tmp/pr-files.txt
            exit 1
          fi

          echo "pr_url=${PR_URL}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          echo "head_ref=${HEAD_REF}" >> "${GITHUB_OUTPUT}"
          echo "title=${TITLE}" >> "${GITHUB_OUTPUT}"
          echo "file_count=${FILE_COUNT}" >> "${GITHUB_OUTPUT}"

          echo "FAILURE_STAGE=required_checks" >> "${GITHUB_ENV}"

      - name: Verify required checks safely
        if: env.ALREADY_MERGED != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # gh pr checks は required checks 0件 / pending / failure で非0終了になることがある。
          # set -e と関数の return code を組み合わせると、判定処理へ到達する前に shell が終了するため、
          # gh の終了コードは必ず if 文の中で捕捉し、JSON の bucket を正として判定する。

          capture_required_checks() {
            local json_file="$1"
            local err_file="$2"
            local rc_file="$3"
            local rc=0

            if gh pr checks "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --required \
              --json name,bucket,state,workflow >"${json_file}" 2>"${err_file}"; then
              rc=0
            else
              rc=$?
            fi

            printf '%s\n' "${rc}" > "${rc_file}"
            return 0
          }

          normalize_required_checks() {
            local json_file="$1"
            local err_file="$2"
            local normalized_file="$3"
            local err_text

            err_text="$(cat "${err_file}" 2>/dev/null || true)"

            if jq -e 'type == "array"' "${json_file}" >/dev/null 2>&1; then
              cp "${json_file}" "${normalized_file}"
              return 0
            fi

            if printf '%s' "${err_text}" | grep -qi 'no required checks reported'; then
              printf '[]\n' > "${normalized_file}"
              return 0
            fi

            echo "::error::required checks の取得結果を解釈できませんでした。"
            printf '%s\n' "${err_text}"
            return 1
          }

          evaluate_required_checks() {
            local normalized_file="$1"
            local failed pending count

            count="$(jq 'length' "${normalized_file}")"
            if [ "${count}" -eq 0 ]; then
              echo 'required checks は設定されていません。正常として続行します。'
              return 0
            fi

            echo 'required checks:'
            jq -r '.[] | "- \(.name): \(.bucket) [\(.workflow // "-")]"' "${normalized_file}"

            failed="$(jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' "${normalized_file}")"
            pending="$(jq '[.[] | select(.bucket == "pending")] | length' "${normalized_file}")"

            if [ "${failed}" -gt 0 ]; then
              echo '::error::必須チェックに失敗またはキャンセルがあります。'
              return 2
            fi

            if [ "${pending}" -gt 0 ]; then
              return 8
            fi

            return 0
          }

          # 初回取得
          capture_required_checks /tmp/required-checks.json /tmp/required-checks.err /tmp/required-checks.rc
          CHECK_EXIT="$(cat /tmp/required-checks.rc)"

          if ! normalize_required_checks /tmp/required-checks.json /tmp/required-checks.err /tmp/required-checks-normalized.json; then
            echo "::error::required checks の取得に失敗しました。gh_exit=${CHECK_EXIT}"
            exit 1
          fi

          EVAL_EXIT=0
          if evaluate_required_checks /tmp/required-checks-normalized.json; then
            EVAL_EXIT=0
          else
            EVAL_EXIT=$?
          fi

          if [ "${EVAL_EXIT}" -eq 2 ]; then
            exit 1
          fi

          # pending の場合だけポーリング。gh pr checks --watch の終了コードには依存しない。
          if [ "${EVAL_EXIT}" -eq 8 ]; then
            echo '必須チェックが未完了です。最大10分待ちます。'
            CHECKS_READY='false'

            for attempt in $(seq 1 60); do
              sleep 10

              capture_required_checks /tmp/required-checks-loop.json /tmp/required-checks-loop.err /tmp/required-checks-loop.rc
              LOOP_EXIT="$(cat /tmp/required-checks-loop.rc)"

              if ! normalize_required_checks /tmp/required-checks-loop.json /tmp/required-checks-loop.err /tmp/required-checks-loop-normalized.json; then
                echo "required checks 再取得を一時的に解釈できませんでした。gh_exit=${LOOP_EXIT}; retry=${attempt}/60"
                continue
              fi

              LOOP_EVAL=0
              if evaluate_required_checks /tmp/required-checks-loop-normalized.json; then
                LOOP_EVAL=0
              else
                LOOP_EVAL=$?
              fi

              if [ "${LOOP_EVAL}" -eq 2 ]; then
                exit 1
              fi

              if [ "${LOOP_EVAL}" -eq 0 ]; then
                CHECKS_READY='true'
                break
              fi

              echo "required checks pending: ${attempt}/60"
            done

            if [ "${CHECKS_READY}" != 'true' ]; then
              echo '::error::必須チェックが10分以内に完了しませんでした。'
              exit 1
            fi
          fi

          echo 'required checks の確認が完了しました。'
          echo 'FAILURE_STAGE=pre_merge_revalidation' >> "${GITHUB_ENV}"

      - name: Revalidate immediately before merge
        if: env.ALREADY_MERGED != 'true'
        id: revalidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail

          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          STATE="$(printf '%s' "${PR_JSON}" | jq -r '.state')"
          DRAFT="$(printf '%s' "${PR_JSON}" | jq -r '.draft')"
          BASE="$(printf '%s' "${PR_JSON}" | jq -r '.base.ref')"
          CURRENT_HEAD_SHA="$(printf '%s' "${PR_JSON}" | jq -r '.head.sha')"
          MERGEABLE="$(printf '%s' "${PR_JSON}" | jq -r '.mergeable')"
          MERGEABLE_STATE="$(printf '%s' "${PR_JSON}" | jq -r '.mergeable_state // "unknown"')"

          [ "${STATE}" = "open" ] || { echo "::error::マージ直前に PR が open ではなくなりました。"; exit 1; }
          [ "${DRAFT}" = "false" ] || { echo "::error::マージ直前に Draft 状態です。"; exit 1; }
          [ "${BASE}" = "main" ] || { echo "::error::マージ直前に base が main ではありません。"; exit 1; }
          [ "${CURRENT_HEAD_SHA}" = "${ORIGINAL_HEAD_SHA}" ] || { echo "::error::安全確認後に PR の HEAD が更新されました。再度本番反映を指示してください。"; exit 1; }
          [ "${MERGEABLE}" != "false" ] || { echo "::error::マージ直前に競合が検出されました。"; exit 1; }

          case "${MERGEABLE_STATE}" in
            dirty)
              echo "::error::マージ直前に競合が検出されました。"
              exit 1
              ;;
          esac

          echo "FAILURE_STAGE=merge" >> "${GITHUB_ENV}"

      - name: Merge Pull Request
        if: env.ALREADY_MERGED != 'true'
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail

          # --match-head-commit で、安全確認後に PR が更新された場合の誤マージを防止する。
          # merge queue が設定されている場合、gh pr merge はキュー投入/auto-mergeになることがある。
          gh pr merge "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --squash \
            --delete-branch \
            --match-head-commit "${EXPECTED_HEAD_SHA}"

          echo "FAILURE_STAGE=merge_confirmation" >> "${GITHUB_ENV}"

          # 通常マージだけでなく merge queue / auto-merge も考慮し、最大10分待つ。
          MERGED="false"
          MERGE_SHA=""
          for attempt in $(seq 1 60); do
            MERGED_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            MERGED="$(printf '%s' "${MERGED_JSON}" | jq -r '.merged')"
            MERGE_SHA="$(printf '%s' "${MERGED_JSON}" | jq -r '.merge_commit_sha // ""')"

            if [ "${MERGED}" = "true" ] && [ -n "${MERGE_SHA}" ] && [ "${MERGE_SHA}" != "null" ]; then
              break
            fi
            sleep 10
          done

          if [ "${MERGED}" != "true" ]; then
            echo "::error::PR のマージ完了を10分以内に確認できませんでした。"
            exit 1
          fi

          echo "merge_sha=${MERGE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "MERGE_SHA=${MERGE_SHA}" >> "${GITHUB_ENV}"
          echo "MERGE_COMPLETED=true" >> "${GITHUB_ENV}"
          echo "FAILURE_STAGE=production_verification" >> "${GITHUB_ENV}"

      - name: Resolve already merged PR state
        if: env.ALREADY_MERGED == 'true'
        id: merged_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          MERGE_SHA="$(printf '%s' "${PR_JSON}" | jq -r '.merge_commit_sha // ""')"

          if [ -z "${MERGE_SHA}" ] || [ "${MERGE_SHA}" = "null" ]; then
            echo "::error::merged PR の merge commit SHA を取得できませんでした。"
            exit 1
          fi

          echo "merge_sha=${MERGE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "MERGE_SHA=${MERGE_SHA}" >> "${GITHUB_ENV}"
          echo "MERGE_COMPLETED=true" >> "${GITHUB_ENV}"
          echo "FAILURE_STAGE=production_verification" >> "${GITHUB_ENV}"

      - name: Verify production content
        id: production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 本番確認は 3 層で行う。
          # 1) GitHub Deployments で対象 merge SHA の github-pages 成功を確認
          # 2) 公開URLが 2xx/3xx で応答することを確認
          # 3) 変更HTMLは可能なら main と公開内容の SHA256 一致も確認（強い確認）
          # GitHub Pages / CDN がHTMLを変換する場合があるため、hash 不一致だけでは失敗にしない。

          DEPLOYMENT_SEEN='false'
          DEPLOYMENT_OK='false'
          CONTENT_MATCH='false'
          HTTP_OK='false'
          HTTP_CODE=''
          VERIFY_MODE='deployment_http'

          HTML_FILES="$(grep -E '\.html$' /tmp/pr-files.txt 2>/dev/null | head -n 10 || true)"

          for attempt in $(seq 1 60); do
            # 対象 merge SHA の deployment を探す。GitHub Pages が deployments API を使う構成なら最優先で確認。
            DEPLOYMENTS_JSON='[]'
            if DEPLOYMENTS_JSON="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/deployments?sha=${MERGE_SHA}&per_page=100" 2>/tmp/deployments.err)"; then
              DEPLOYMENT_ID="$(printf '%s' "${DEPLOYMENTS_JSON}" | jq -r '[.[] | select(.environment == "github-pages" or .environment == "production")][0].id // empty')"

              if [ -n "${DEPLOYMENT_ID}" ]; then
                DEPLOYMENT_SEEN='true'
                STATUS_JSON='[]'
                if STATUS_JSON="$(gh api \
                  -H 'Accept: application/vnd.github+json' \
                  "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses?per_page=20" 2>/tmp/deployment-status.err)"; then
                  DEPLOY_STATE="$(printf '%s' "${STATUS_JSON}" | jq -r '.[0].state // "pending"')"
                  echo "deployment state: ${DEPLOY_STATE}"

                  case "${DEPLOY_STATE}" in
                    success)
                      DEPLOYMENT_OK='true'
                      ;;
                    failure|error)
                      echo '::error::GitHub Pages / production deployment が失敗しました。'
                      exit 1
                      ;;
                  esac
                fi
              fi
            fi

            HTTP_CODE="$(curl \
              --silent \
              --show-error \
              --location \
              --compressed \
              --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 20 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "${PUBLIC_URL}/?deploy_check=${MERGE_SHA}-${attempt}" || true)"

            case "${HTTP_CODE}" in
              2*|3*) HTTP_OK='true' ;;
              *) HTTP_OK='false' ;;
            esac

            # HTML変更がある場合は内容一致も試す。これは deployment API が見えない環境の代替確認にもなる。
            if [ -n "${HTML_FILES}" ] && [ "${HTTP_OK}" = 'true' ]; then
              ALL_MATCH='true'

              while IFS= read -r file; do
                [ -n "${file}" ] || continue

                API_JSON=''
                if ! API_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${file}?ref=main" 2>/tmp/content-api.err)"; then
                  ALL_MATCH='false'
                  break
                fi

                ENCODING="$(printf '%s' "${API_JSON}" | jq -r '.encoding // ""')"
                CONTENT="$(printf '%s' "${API_JSON}" | jq -r '.content // ""')"

                if [ "${ENCODING}" != 'base64' ] || [ -z "${CONTENT}" ]; then
                  ALL_MATCH='false'
                  break
                fi

                printf '%s' "${CONTENT}" | tr -d '\n' | base64 --decode > /tmp/expected.html
                EXPECTED_HASH="$(sha256sum /tmp/expected.html | awk '{print $1}')"

                PUBLIC_PATH="${PUBLIC_URL}/${file}"
                if ! curl \
                  --fail \
                  --silent \
                  --show-error \
                  --location \
                  --compressed \
                  --max-time 20 \
                  -H 'Cache-Control: no-cache' \
                  -H 'Pragma: no-cache' \
                  "${PUBLIC_PATH}?deploy_check=${MERGE_SHA}-${attempt}" > /tmp/public.html; then
                  ALL_MATCH='false'
                  break
                fi

                PUBLIC_HASH="$(sha256sum /tmp/public.html | awk '{print $1}')"
                if [ "${EXPECTED_HASH}" != "${PUBLIC_HASH}" ]; then
                  ALL_MATCH='false'
                  break
                fi
              done <<< "${HTML_FILES}"

              if [ "${ALL_MATCH}" = 'true' ]; then
                CONTENT_MATCH='true'
              fi
            fi

            # 成功条件:
            # - deployment成功 + HTTP応答、または
            # - deployment API が使えない/見えない場合でも、変更HTMLの実内容一致 + HTTP応答
            if [ "${HTTP_OK}" = 'true' ] && { [ "${DEPLOYMENT_OK}" = 'true' ] || [ "${CONTENT_MATCH}" = 'true' ]; }; then
              break
            fi

            echo "本番反映待ち: attempt=${attempt}/60 deployment_seen=${DEPLOYMENT_SEEN} deployment_ok=${DEPLOYMENT_OK} content_match=${CONTENT_MATCH} http=${HTTP_CODE}"
            sleep 10
          done

          if [ "${HTTP_OK}" != 'true' ]; then
            echo '::error::本番URLが10分以内に正常応答しませんでした。'
            exit 1
          fi

          if [ "${DEPLOYMENT_OK}" = 'true' ]; then
            if [ "${CONTENT_MATCH}" = 'true' ]; then
              VERIFY_MODE='deployment_http_content'
            else
              VERIFY_MODE='deployment_http'
              echo '::warning::deployment は成功しましたが、公開HTMLのバイト単位一致は確認できませんでした。CDN/Pages変換の可能性があるため deployment 成功を正とします。'
            fi
          elif [ "${CONTENT_MATCH}" = 'true' ]; then
            VERIFY_MODE='content_http_fallback'
            echo '::warning::対象SHAのdeploymentをAPIで確認できませんでしたが、mainと公開HTMLの内容一致を確認しました。'
          else
            echo '::error::本番URLは応答していますが、対象マージのデプロイ完了または公開内容一致を10分以内に確認できませんでした。'
            exit 1
          fi

          echo "http_code=${HTTP_CODE}" >> "${GITHUB_OUTPUT}"
          echo 'verified=true' >> "${GITHUB_OUTPUT}"
          echo "verify_mode=${VERIFY_MODE}" >> "${GITHUB_OUTPUT}"
          echo 'FAILURE_STAGE=telegram_success_notification' >> "${GITHUB_ENV}"

      - name: Notify Telegram success
        if: success()
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          HTTP_CODE: ${{ steps.production.outputs.http_code }}
          VERIFY_MODE: ${{ steps.production.outputs.verify_mode }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN が未設定です。"
            exit 0
          fi

          if [ "${ALREADY_MERGED}" = "true" ]; then
            MERGE_TEXT='マージ: 既に完了済み'
          else
            MERGE_TEXT='マージ: 成功'
          fi

          if [ "${VERIFY_MODE}" = "content_hash" ]; then
            VERIFY_TEXT='公開確認: 変更HTMLの内容一致を確認'
          else
            VERIFY_TEXT="公開確認: HTTP ${HTTP_CODE}"
          fi

          MESSAGE="$(printf '%s\n\n%s\n%s\n%s\n%s\n%s' \
            '本番反映しました。' \
            "対象PR: #${PR_NUMBER}" \
            "${MERGE_TEXT}" \
            "${VERIFY_TEXT}" \
            "公開URL: ${PUBLIC_URL}/" \
            "PR: ${PR_URL}")"

          PAYLOAD="$(jq -n \
            --arg chat_id "${CHAT_ID}" \
            --arg text "${MESSAGE}" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}')"

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            -d "${PAYLOAD}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            || echo "::warning::本番反映は成功しましたが、Telegram 成功通知に失敗しました。"

      - name: Notify Telegram failure
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN が未設定のため失敗通知を送れません。"
            exit 0
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          case "${FAILURE_STAGE}" in
            payload_validation)
              REASON='本番反映依頼のデータ確認で停止しました。'
              ;;
            pr_validation)
              REASON='対象PRの安全確認で停止しました。'
              ;;
            required_checks)
              REASON='PRの必須チェック確認で停止しました。'
              ;;
            pre_merge_revalidation)
              REASON='マージ直前の再確認で停止しました。'
              ;;
            merge)
              REASON='PRのマージ処理で停止しました。'
              ;;
            merge_confirmation)
              REASON='マージ要求後、完了確認で停止しました。'
              ;;
            production_verification)
              REASON='PRはマージ済みですが、本番サイトへの反映確認で停止しました。'
              ;;
            *)
              REASON="処理途中で停止しました。stage=${FAILURE_STAGE}"
              ;;
          esac

          if [ "${MERGE_COMPLETED}" = "true" ]; then
            MERGE_STATUS='マージ状態: 完了済み（再マージしないでください）'
          else
            MERGE_STATUS='マージ状態: 未完了'
          fi

          MESSAGE="$(printf '%s\n\n%s\n%s\n%s\n\n%s' \
            '本番反映を完了できませんでした。' \
            "対象PR: #${PR_NUMBER}" \
            "${REASON}" \
            "${MERGE_STATUS}" \
            "詳細: ${RUN_URL}")"

          PAYLOAD="$(jq -n \
            --arg chat_id "${CHAT_ID}" \
            --arg text "${MESSAGE}" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}')"

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            -d "${PAYLOAD}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            || echo "::warning::Telegram 失敗通知の送信にも失敗しました。"
